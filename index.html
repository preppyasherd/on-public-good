          // every precinct gets a short street name; the four RTO sites are named after their streets
          // (Site 1 uses two streets: a stand-in precinct next to it is already "Bendemeer Rd")
          const SITE_NAMES = { "Site 1": "Bendemeer Rd – Towner Rd", "Site 2": "Havelock Rd", "Site 3": "Circuit Rd", "Site 4": "Chin Swee Rd" };
          precs.forEach((pr) => {

          addEventListener("resize", () => requestAnimationFrame(drawNav));
          addEventListener("hashchange", applyHash);
          addEventListener("keydown", (e) => {

            }
          });

        }

        /* ---------- styling ---------- */
        // Both checkbox lists (VERS status and Block type) always filter the map;
        // the Map mode switch only decides which one colours it.
        function visible(p) {

          return true;
        }
        function styleFor(p) {
          const B = T.blocks;
          // outside the selected town / precinct: one flat grey, no colour
          if (S.state >= 1 && !inScope(p)) return { fill: true, fillColor: B.out, fillOpacity: 1, stroke: false };
          const v = visible(p);
          if (!v) return { stroke: false, fill: false };

          const col = S.colorBy === "typ" ? (p.ty == null ? B.out : CT[p.ty]) : CB[p.band];
          let op = B.opacity;
          if (S.state === 3 && p !== S.blk)

              op,
              p.pid === S.prec ? Math.max(B.context, B.opacity * 0.58) : B.context * 0.8,

          const lo = z < 14;

            z < 12.5 ? 1.6 : z < 14 ? 1 : z < 15.5 ? B.outlineWeight * 0.5 : B.outlineWeight;
          const s = {
            fill: true,
            fillColor: col,
            fillOpacity: op,
            stroke: w > 0,
            color: lo ? col : B.outline,
            weight: w,
            opacity: op,
          };
          if (T.sites.outline && precs[p.pid] && precs[p.pid].site) {
            s.stroke = true;
            s.color = T.sites.color;
            s.weight = T.sites.weight;
            s.opacity = 1;
          }
          if (p.sers) {
            s.stroke = true;
            s.color = light ? B.selected : B.sers;
            s.weight = 2;
            s.opacity = 1;
          }
          if (S.blk === p) {
            s.stroke = true;
            s.color = B.selected;
            s.weight = B.selectedWeight;
            s.opacity = 1;
            s.fillOpacity = 1;

        function restyle() {
          blocks.forEach((p) => p.layer.setStyle(styleFor(p)));
        }
        function setBasemap(light) {
          const b = light ? T.base.light : T.base.dark;
          baseLayer.setStyle({
            color: b.line,
            fillColor: b.land,
            opacity: b.lineOpacity,
            weight: b.lineWeight,
            stroke: b.lineWeight > 0,

          document.getElementById("mapwrap").style.background = b.water;

        }

        /* ---------- state machine ---------- */
        const HINTS = [
          "Hover a town or an RTO site · <b>click</b> to zoom in",
          "Hover a precinct · <b>click</b> to zoom in",
          "Hover a block · <b>click</b> to see its future",
          "<b>Apply for RTO</b> below · Esc to go back",
        ];
        const seen = new Set();
        function showHint() {
          const h = document.getElementById("hint");

            ? HINTS[S.state].replace("Hover", "Tap").replace("<b>click</b>", "<b>tap again</b>")

        }
        let flying = false;
        function fly(b, pad) {
          flying = true;

              flying = false;

          );
          // leave room for the right panel and, at block scale, the block card
          const card = S.state === 3 ? Math.min(CARD.offsetHeight || 0, map.getSize().y * 0.45) : 0;
          map.flyToBounds(b, {
            paddingTopLeft: pad,
            paddingBottomRight: [pad[0] + rpWidth(), pad[1] + card],

        function go(state, opts = {}) {
          const prev = S.state;

          hoverObj = null;
          tipHide();
          S.state = state;
          if (state < 3) {
            S.blk = null;
            closeDrawer();
          }
          if (state < 2) S.prec = null;
          if (state < 1) S.town = null;
          setBasemap(state >= 2);
          drawHighlights();
          restyle();
          renderPanel();
          renderCrumbs();
          showHint();
          if (!opts.noFly) {
            if (state === 0) fly(baseLayer.getBounds(), [10, 10]);
            if (state === 1) fly(S.town.bounds, [40, 40]);
            if (state === 2) {
              // show the whole precinct plus the first walking-distance band
              const pr = precs[S.prec];
              const band = L.latLng(pr.c).toBounds(2 * ringRadii().at(-1) * 1.04); // the whole outer ring
              fly(L.latLngBounds(pr.bounds.getSouthWest(), pr.bounds.getNorthEast()).extend(band), [30, 30]);
            }
            if (state === 3) fly(S.blk.bounds.pad(2.2), [60, 60]);

        }
        function goUp() {

        function openTown(t) {

        }
        function openPrec(pr) {
          S.town = towns.find((t) => t.name === pr.town);
          S.prec = pr.id;
          go(2);
        }
        function openBlk(p) {
          S.town = towns.find((t) => t.name === p.t);
          S.prec = p.pid;
          S.blk = p;
          go(3);
        }

        function drawHighlights(hover) {
          hiLayer.clearLayers();
          overlayLayer.clearLayers();
          amenLayer.clearLayers();
          // sites: always outlined in red (QGIS "261030 5 Sites")
          if (S.state === 1 && S.town)
            precs
              .filter((p) => p && p.town === S.town.name && !p.site)
              .forEach((pr) =>
                hiLayer.addLayer(
                  L.polygon(pr.ll, {
                    renderer,
                    interactive: false,
                    color: T.precinct.outline,
                    weight: 1,
                    dashArray: "3 4",
                    opacity: T.precinct.outlineOpacity,
                    fill: false,
                  }),
                ),
              );
          if (S.state >= 2 && S.prec != null) {
            const pr = precs[S.prec];
            if (!pr.site)
              hiLayer.addLayer(
                L.polygon(pr.ll, {
                  renderer,
                  interactive: false,
                  color: T.precinct.light,
                  weight: 1.5,
                  dashArray: "5 5",
                  fill: false,
                }),
              );
            // walking-distance bands around the centre of the precinct
            if (T.rings.show)
              ringRadii().forEach((r) => {
                hiLayer.addLayer(
                  L.circle(pr.c, {
                    radius: r,
                    renderer,
                    interactive: false,
                    color: T.rings.color,
                    weight: 1,
                    dashArray: "2 5",
                    fill: false,
                  }),
                );
                // label at the top of each ring: "500 m · 6 min"
                const top = [pr.c[0] + r / 110540, pr.c[1]];

                  L.marker(top, {
                    interactive: false,
                    keyboard: false,
                    zIndexOffset: 1000, // ring labels stay above the facility circles
                    icon: L.divIcon({
                      className: "",
                      html: `<span class="ringlbl" style="border-color:${T.rings.color}">${fmt(r)} m · ${walkMin(r)} min</span>`,
                      iconSize: [0, 0],

        }
        function hoverShape(ll, light) {
          return L.polygon(ll, {
            renderer,
            interactive: false,
            color: light ? T.hover.light : T.hover.dark,
            weight: T.hover.weight,
            fillColor: light ? T.hover.light : T.hover.dark,
            fillOpacity: light ? 0 : 0.06,
          });
        }
        // sites: outline their blocks, not the site rectangle
        function hoverFor(o, light) {
          if (o.kind === "prec" && o.site) {
            const g = L.featureGroup();
            o.blocks.forEach((b) =>
              g.addLayer(
                L.polygon(b.ll, {
                  renderer,
                  interactive: false,
                  color: light ? T.hover.light : T.hover.dark,
                  weight: Math.max(1, T.hover.weight * 0.75),
                  fill: false,
                }),
              ),
            );
            return g;
          }
          return hoverShape(o.ll, light);
        }

        /* ---------- walking-distance bands ---------- */
        // Radii of the bands, e.g. spacing 500 × count 3 → [500, 1000, 1500]
        function ringRadii() {
          return T.rings.radii.map(Number).filter((r) => r > 0).sort((a, b) => a - b);
        }
        const walkMin = (m) => Math.max(1, Math.round(m / 80)); // walking at 80 m per minute

        /* ---------- amenities (real data) ---------- */
        function near(pr, r) {
          const out = {};
          Object.keys(AM).forEach(
            (k) =>
              (out[k] = D.amen[k]
                .map((a) => ({ a, d: dist(pr.c, [a[1], a[0]]) }))
                .filter((x) => x.d <= r)
                .sort((x, y) => x.d - y.d)),
          );
          return out;
        }
        function drawAmenities(pr) {
          const n = near(pr, Math.max(...ringRadii()) + 50);
          Object.entries(n).forEach(([k, list]) => {
            const m = AM[k];
            if (!S.fac[m.grp] || !T.amen[k].show) return;
            const sz = T.amenSize.pin; // every facility the same size
            list.forEach(({ a, d }) => {
              const ll = [a[1], a[0]];
              const mk = L.marker(ll, {
                icon: L.divIcon({ // same size for every type
                  className: "",
                  html: `<div class="pin" style="background:${m.bg};width:${sz}px;height:${sz}px">${icon(k, Math.round(sz * 0.6))}</div>`,
                  iconSize: [sz, sz],
                  iconAnchor: [sz / 2, sz / 2],
                }),
                keyboard: false,
                zIndexOffset: m.dot ? 0 : 100,
              });
              const walkMinutes = Math.max(1, Math.round(d / 80)); // 80 m per minute
              const html = `
                <b>${a[2] || m.name}</b>
                <span class="m">${m.name} · ${Math.round(d)} m · ~${walkMinutes} min walk</span>`;
              mk.on("mouseover", (e) => tipShow(e.originalEvent, html));
              mk.on("mouseout", tipHide);
              amenLayer.addLayer(mk);
            });
          });
        }
        function nearestDonors(p) {
          const pr = precs[p.pid];
          const c = p.bounds.getCenter();
          return pr.blocks
            .filter((b) => b !== p)
            .map((b) => ({ b, d: c.distanceTo(b.bounds.getCenter()) }))
            .sort((a, b) => a.d - b.d)
            .slice(0, 2)
            .map((x) => x.b);
        }
        function drawRecovery(p) {
          const c = p.bounds.getCenter();
          nearestDonors(p).forEach((b) => {
            const bc = b.bounds.getCenter();
            const R = T.recovery;
            overlayLayer.addLayer(
              L.polyline([bc, c], {
                renderer,
                interactive: false,
                color: R.color,
                weight: R.weight,
                dashArray: "6 5",
              }),
            );
            overlayLayer.addLayer(
              L.polygon(b.ll, {
                renderer,
                interactive: false,
                color: R.color,
                weight: R.weight * 0.75,
                dashArray: "3 3",
                fill: false,
              }),
            );
          });
          overlayLayer.addLayer(
            L.circleMarker(c, {
              renderer,
              interactive: false,
              radius: 5,
              color: T.recovery.color,
              fillColor: T.recovery.color,
              fillOpacity: 1,
            }),
          );
        }

        /* ---------- hit testing ---------- */
        let hoverObj = null,
          lastTap = null;
        function hitTest(ll) {
          if (S.state === 0) {
            const s = sites.find((s) => s.bounds.contains(ll) && inRings(ll, s.ll));
            if (s) return s;
            return towns.find((t) => t.bounds.contains(ll) && inRings(ll, t.ll)) || null;
          }
          if (S.state === 1) {
            const s = sites.find((s) => s.bounds.contains(ll) && inRings(ll, s.ll));
            if (s) return s;
            const pr = precs.find(
              (p) => p && p.town === S.town.name && p.bounds.contains(ll) && inRings(ll, p.ll),
            );
            if (pr) return pr;
            return (
              towns.find((t) => t !== S.town && t.bounds.contains(ll) && inRings(ll, t.ll)) || null
            );
          }
          const p = blocks.find((p) => p.bounds.contains(ll) && inRings(ll, p.ll));
          if (!p) return null;
          if (p.pid !== S.prec) return precs[p.pid]; // grey block outside the precinct: opens its precinct
          return visible(p) ? p : null;
        }
        // grey (outside the selection) things can be clicked but get no tooltip
        const outside = (o) =>
          (S.state === 1 && o.kind === "town") || (S.state >= 2 && o.kind === "prec");
        function vtxt(p) {
          return p.v == null
            ? "HDB-owned rental — no lease sold"
            : p.v <= 0
              ? "VERS-eligible from " + (p.ls + 70)
              : p.v + " yrs till VERS (" + (p.ls + 70) + ")";
        }
        // Tooltip text when hovering a town, precinct/site or block
        function describe(o) {
          if (o.kind === "town") {
            return `<b>${o.name}</b>`; // name only; the bar below gives the share
          }
          if (o.kind === "prec") return `<b>${precTitle(o)}</b>`; // name only; the bar below gives the share
          const p = o; // a block
          return `<b>Blk ${p.b} ${tc(p.s)}</b>`; // name only; details are on the right panel card
        }
        // The popup keeps one bar between hovers, so its segments slide from the last
        // place's values to the next one's. Towns / precincts: VERS-eligible within 20 yrs
        // (split by VERS band). Blocks: lease used out of 70 years.
        const tip = document.getElementById("tip");
        tip.innerHTML = `<div class="tm"></div>
          <div class="tbar">
            <div class="trow"><span class="th"></span><span class="tv"></span></div>
            <span class="tk">${BANDS.map(() => "<i></i>").join("")}</span>
          </div>`;
        const tipText = tip.querySelector(".tm"), tipBar = tip.querySelector(".tbar");
        function barFor(o) {
          if (!o || !o.kind && o.b == null) return null;
          const seg = [0, 0, 0, 0, 0, 0, 0];
          if (o.kind === "town" || o.kind === "prec") {
            const bl = o.blocks, n = bl.length || 1;
            bl.forEach((p) => p.band !== "unk" && seg[p.band]++);
            return {
              head: "VERS-eligible within 20 yrs",
              name: o.kind === "town" ? o.name : o.short,
              seg: seg.map((x) => (x / n) * 100),
              val: Math.round(shareSoon(bl) * 100) + "%",
            };
          }
          if (o.ls == null) return null; // rental block: no lease, no bar
          const used = NOW - o.ls;
          seg[o.band] = Math.max(0, Math.min(100, (used / 70) * 100));
          return {
            head: "Lease used, of 70 years to VERS",
            name: "Blk " + o.b,
            seg,
            val: used >= 70 ? "VERS-eligible now" : `${used} / 70 yrs`,
          };
        }
        function tipShow(ev, html, bar) {
          const r = document.getElementById("mapwrap").getBoundingClientRect();
          tipText.innerHTML = html;
          tipBar.hidden = !bar;
          if (bar) {
            tipBar.querySelector(".th").textContent = bar.head;
            tipBar.querySelector(".tv").textContent = bar.val;
            tipBar.querySelectorAll(".tk i").forEach((el, i) => {
              el.style.background = CB[i];
              el.style.width = bar.seg[i] + "%";
            });
          }
          tip.classList.add("on");
          let x = ev.clientX - r.left + 14,
            y = ev.clientY - r.top + 14;
          if (x + 270 > r.width) x -= 290;
          if (y + 100 > r.height) y -= 110;
          tip.style.left = x + "px";
          tip.style.top = y + "px";
        }
        function tipHide() {
          tip.classList.remove("on");
        }
        function wire() {
          map.on("mousemove", (e) => {
            const o = hitTest(e.latlng);
            document.getElementById("mapHome").style.cursor = o ? "pointer" : "";
            if (o !== hoverObj) {
              hoverObj = o;
              previewCard(o); // the right panel card shows what the pointer is on
              drawHighlights(o ? hoverFor(o, S.state >= 2) : null);
            }
            o && !outside(o) ? tipShow(e.originalEvent, describe(o), barFor(o)) : tipHide();
          });
          map.on("mouseout", () => {
            tipHide();
            hoverObj = null;
            drawHighlights();
          });
          // leaving the map (onto a panel or the block card) puts the selected block's carbon back
          document.getElementById("mapwrap").addEventListener("mouseleave", () => {
            tipHide();
            hoverObj = null;
            previewCard(null); // back to the current selection
          });
          CARD.addEventListener("mouseenter", () => {
            hoverObj = null;
            tipHide();
            previewCard(null);
          });
          map.on("click", (e) => {
            const o = hitTest(e.latlng);
            if (!o) return;
            if (matchMedia("(hover:none)").matches && lastTap !== o && !outside(o)) {
              lastTap = o;
              tipShow(e.originalEvent, describe(o), barFor(o));
              drawHighlights(hoverFor(o, S.state >= 2));
              return;
            }
            lastTap = null;
            tipHide();
            seen.add(S.state);
            if (o.kind === "town") openTown(o);
            else if (o.kind === "prec") openPrec(o);
            else openBlk(o);
          });
          map.on("zoomend", () => {
            if (flying) {
              return;
            }
            const z = map.getZoom();
            if (S.state >= 1 && z < 11.6) go(0, { noFly: true });
            else if (S.state >= 2 && z < 13.6) go(1, { noFly: true });
            else restyle();
          });
        }

        /* ---------- crumbs ---------- */
        function renderCrumbs() {
          // stepped breadcrumb list, top left of the map: one line per scale, each below the one before
          const c = document.getElementById("crumbs");
          c.classList.remove("hide");
          c.innerHTML = crumbList();
          c.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => go(+b.dataset.go)));
        }
        /* =========================================================
           SIDE PANELS
           Left panel  (<aside id="panel">)  — the same sections at every
             scale; only the numbers change (they count the current scope).
             → panelLeft()
           Right panel (<aside id="rpanel">) — navigator, summary card,
             bar graphs, "At risk", and extras for the precinct scale.
             → panelRight()
           Block card (bottom centre of the map, block scale only) —
             flat details, embodied carbon, Apply for RTO.
             → renderBlockCard()
           Each one builds its HTML as a text template, then connects
           the buttons ("wire up" section).
           ========================================================= */
        const P = document.getElementById("panelInner");
        const RP = document.getElementById("rpInner");
        const CARD = document.getElementById("blkcard");

        // Small helpers for building HTML
        const list = (items, fn) => items.map(fn).join(""); // one piece of HTML per item
        const when = (condition, htmlText) => (condition ? htmlText : ""); // HTML only if true
        const yearOrDash = (v) => (v == null ? "—" : VB + v); // years-till-VERS → calendar year

        const SCALES = ["Singapore", "Town", "Precinct", "Block"];
        const soon = (p) => p.v != null && p.v <= 20; // VERS-eligible within 20 yrs (by VB + 20)
        const precTitle = (pr) => `${pr.short} precinct`;
        const sum = (arr, fn) => arr.reduce((s, x) => s + (fn(x) || 0), 0);

        // The blocks the panels count: whole island, one town, or one precinct
        // (at block scale the panels keep counting the block's precinct)
        function scope() {
          if (S.state === 0) return blocks;
          if (S.state === 1) return S.town.blocks;
          return precs[S.prec].blocks;
        }
        function inScope(p) {
          if (S.state === 0) return true;
          if (S.state === 1) return p.t === S.town.name;
          return p.pid === S.prec;
        }
        function scopeName() {
          if (S.state === 0) return "Singapore";
          if (S.state === 1) return S.town.name;
          return precTitle(precs[S.prec]);
        }
        // one bar split into VERS band colours, for a set of blocks
        function bandBar(bl) {
          const per = [0, 0, 0, 0, 0, 0, 0];
          bl.forEach((p) => p.band !== "unk" && per[p.band]++);
          const n = bl.length || 1;
          return list(per, (x, i) => when(x, `<i style="width:${(x / n) * 100}%;background:${CB[i]}"></i>`));
        }
        const shareSoon = (bl) => (bl.length ? bl.filter(soon).length / bl.length : 0);

        /* ---------- Map mode switch (bottom-left of the map) ---------- */
        const MODE = document.getElementById("modeSw");
        function renderMode() {
          MODE.innerHTML = `
            <span class="ml">Map mode</span>
            <span class="seg">
              <button data-c="vers" aria-pressed="${S.colorBy === "vers"}">VERS status</button>
              <button data-c="typ" aria-pressed="${S.colorBy === "typ"}">Block type</button>
            </span>
            <button class="themebtn" id="themeBtn" type="button" aria-pressed="${NIGHT_ON}" title="${NIGHT_ON ? "Switch to day mode" : "Switch to night mode"}">
              <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <span class="lbl-t">${NIGHT_ON ? "Day" : "Night"}</span>
            </button>`;
          MODE.querySelector("#themeBtn").onclick = toggleTheme;
          MODE.querySelectorAll("button[data-c]").forEach((btn) => {
            btn.onclick = () => {
              S.colorBy = btn.dataset.c;
              restyle();
              renderPanel();
              // no scrolling and no unfolding: just highlight the matching list's heading
              const sec = P.querySelector(S.colorBy === "typ" ? "#sec-typ" : "#sec-vers");
              sec.classList.add("flash");
              setTimeout(() => sec.classList.remove("flash"), 900);
            };
          });
          layoutTop();
        }
        // the block card's height, so the hint can sit 8px above it
        function layoutTop() {
          const mw = document.getElementById("mapwrap");
          mw.style.setProperty("--card-h", (S.state === 3 && CARD.classList.contains("open") ? CARD.offsetHeight : 0) + "px");
          mw.classList.toggle("hint-left", document.getElementById("nearbox").classList.contains("open"));
        }
        addEventListener("resize", () => requestAnimationFrame(layoutTop));
        new MutationObserver(() => requestAnimationFrame(layoutTop)).observe(document.getElementById("hint"), { childList: true });

        let lastState = -1;
        let rpOpen = true; // right panel open (× closes it, the "Details" tab reopens it)
        let cardMin = false; // block card collapsed
        function renderPanel() {
          // scroll back to the top when the scale changes
          const scaleChanged = lastState !== S.state;
          panelLeft();
          panelRight();
          renderBlockCard();
          renderMode();
          if (scaleChanged) {
            document.getElementById("panel").scrollTop = 0;
            document.getElementById("rpanel").scrollTop = 0;
            lastState = S.state;
          }
        }

        // compact tonnes: 17.2 Mt · 542 kt · 18,122 t
        const tonnes = (t) =>
          t >= 1e6 ? (t / 1e6).toFixed(1) + " Mt" : t >= 1e5 ? Math.round(t / 1e3) + " kt" : fmt(t) + " t";
        // "Rank by total embodied carbon": the next level down, highest first; counts the blocks
        // shown on the map (follows the checkboxes); grey bars relative to the top row
        function carbonRows() {
          let rows;
          if (S.state === 0) rows = towns.map((t) => ({ name: t.name, attr: `data-town="${t.name}"`, v: sum(t.blocks.filter((p) => visible(p)), (p) => p.ec) }));
          else if (S.state === 1)
            rows = precs.filter((p) => p && p.town === S.town.name).map((pr) => ({ name: pr.short, attr: `data-prec="${pr.id}"`, v: sum(pr.blocks.filter((p) => visible(p)), (p) => p.ec) }));
          else rows = precs[S.prec].blocks.filter((p) => visible(p)).map((p) => ({ name: "Blk " + p.b, attr: `data-i="${p.i}"`, v: p.ec || 0, on: S.blk === p }));
          rows.sort((a, b) => b.v - a.v);
          if (S.state === 0) rows = rows.slice(0, 10);
          if (S.state === 1) rows = rows.slice(0, 12);
          const max = rows.length ? rows[0].v || 1 : 1;
          return list(rows, (r) => `
            <button class="tw cw ${when(r.on, "on")}" ${r.attr}>
              <span>${r.name}</span>
              <span class="bar"><i style="width:${Math.max(2, (r.v / max) * 100)}%"></i></span>
              <span class="pct">${tonnes(r.v)}</span>
            </button>`);
        }

        /* ---------- LEFT PANEL ---------- */
        function panelLeft() {
          const sc = scope();

          // what the map shows: "Showing …" and the carbon total follow both sets of checkboxes
          const shown = sc.filter((p) => visible(p));
          const showFlats = sum(shown, (p) => p.u);

          // ranking list: always the next level down
          let rankHead = "", rankRows = "";
          if (S.state === 0) {
            rankHead = "Rank by VERS eligibility";
            rankRows = list(
              towns.map((t) => ({ t, share: shareSoon(t.blocks) })).sort((a, b) => b.share - a.share).slice(0, 10),
              (r) => `
                <button class="tw" data-town="${r.t.name}">
                  <span>${r.t.name}</span>
                  <span class="bar">${bandBar(r.t.blocks)}</span>
                  <span class="pct">${Math.round(r.share * 100)}%</span>
                </button>`);
          } else if (S.state === 1) {
            rankHead = "Rank by VERS eligibility";
            rankRows = list(
              precs
                .filter((p) => p && p.town === S.town.name)
                .map((pr) => ({ pr, share: shareSoon(pr.blocks) }))
                .sort((a, b) => b.share - a.share || (a.pr.early ?? 99) - (b.pr.early ?? 99))
                .slice(0, 12),
              (r) => `
                <button class="tw" data-prec="${r.pr.id}">
                  <span>${r.pr.short}</span>
                  <span class="bar">${bandBar(r.pr.blocks)}</span>
                  <span class="pct">${Math.round(r.share * 100)}%</span>
                </button>`);
          } else {
            rankHead = "Rank by VERS eligibility";
            rankRows = list(
              precs[S.prec].blocks.slice().sort((a, b) => (a.v ?? 99) - (b.v ?? 99)),
              (p) => {
                const used = p.ls == null ? 0 : Math.max(4, Math.min(100, ((NOW - p.ls) / 70) * 100)); // lease age ÷ 70
                return `
                <button class="tw ${when(S.blk === p, "on")}" data-i="${p.i}">
                  <span>Blk ${p.b}</span>
                  <span class="bar"><i style="width:${used}%;background:${CB[p.band]}"></i></span>
                  <span class="pct">${yearOrDash(p.v)}</span>
                </button>`;
              });
          }

          // --- HTML ---
          P.innerHTML = `
            <div class="scalehead">
              <h2 class="title">Retrofit-To-Order</h2>
            </div>
            <p class="dek">Find blocks under threat of VERS demolition. Years till VERS-eligible = lease start + 70 − ${VB}.</p>

            <section id="sec-vers" class="fold ${when(S.open.vers, "open")} ${when(S.colorBy === "vers", "active")}">
              <button class="lghead foldbtn" data-fold="vers" aria-expanded="${S.open.vers}" aria-controls="list-vers">
                <span>${icon("chevdown", 16)}VERS status</span>
              </button>
              <div class="legend" id="list-vers">
                ${list(BANDS, (b) => `
                  <label class="lg">
                    <input type="checkbox" data-b="${b.k}" ${when(S.on.has(b.k), "checked")}>
                    <span class="sw" style="background:${CB[b.k]}"></span>
                    <span>${bandLabel(b)} <span class="muted">${bandYears(b)}</span></span>
                  </label>`)}
              </div>
              <div class="tot"><span>Showing</span><span>${fmt(shown.length)} blocks · ${fmt(showFlats)} flats</span></div>
            </section>

            <section id="sec-typ" class="fold ${when(S.open.typ, "open")} ${when(S.colorBy === "typ", "active")}">
              <button class="lghead typ foldbtn" data-fold="typ" aria-expanded="${S.open.typ}" aria-controls="list-typ">
                <span>${icon("chevdown", 16)}Block type</span>
              </button>
              <div class="legend" id="list-typ">
                ${list(TYP, (t) => `
                  <label class="lg typ">
                    <input type="checkbox" data-t="${t.k}" ${when(S.typOn.has(t.k), "checked")}>
                    <span class="sw" style="background:${CT[t.k]}"></span>
                    <span>${t.name}</span>
                  </label>`)}
              </div>
              <p class="dek note foldnote">Block type from the QGIS project 261118 RTO Interface, for every HDB block.</p>
            </section>

            <section id="sec-rank" class="fold ${when(S.open.rank, "open")}">
              <button class="lghead foldbtn" data-fold="rank" aria-expanded="${S.open.rank}" aria-controls="list-rank">
                <span>${icon("chevdown", 16)}${rankHead}</span>
              </button>
              <div class="towns" id="list-rank">${rankRows}</div>
            </section>

            <section id="sec-carbon" class="fold ${when(S.open.carbon, "open")}">
              <button class="lghead foldbtn" data-fold="carbon" aria-expanded="${S.open.carbon}" aria-controls="list-carbon">
                <span>${icon("chevdown", 16)}Rank by total embodied carbon</span>
              </button>
              <div class="towns" id="list-carbon">${carbonRows()}</div>
            </section>

            <details class="method">
              <summary>Method &amp; sources</summary>
              <p>Layers come from the QGIS project <i>261118 RTO Interface</i>: HDB block type with embodied carbon (every block), HDB VERS status (lease start B) and MP2019 subzones as the base map. Years till VERS-eligible = lease start + 70 − ${VB}; a block eligible in ${VB + 10} counts as 10 yrs.</p>
              <p>Towns are HDB towns, drawn by grouping each town's blocks. Precincts outside your sites are a stand-in: blocks clustered by distance (~14 per precinct), named after their most common street.</p>
              <p>Data: HDB, URA, LTA, MOE, ECDA, NEA, MOH, NParks via data.gov.sg (Singapore Open Data Licence).</p>
            </details>`;

          // --- wire up ---
          P.querySelectorAll("[data-fold]").forEach((btn) => {
            btn.onclick = () => {
              S.open[btn.dataset.fold] = !S.open[btn.dataset.fold];
              panelLeft();
            };
          });
          P.querySelectorAll("input[data-b]").forEach((input) => {
            input.onchange = () => {
              input.checked ? S.on.add(+input.dataset.b) : S.on.delete(+input.dataset.b);
              restyle();
              renderPanel();
            };
          });
          P.querySelectorAll("input[data-t]").forEach((input) => {
            input.onchange = () => {
              input.checked ? S.typOn.add(+input.dataset.t) : S.typOn.delete(+input.dataset.t);
              restyle();
              renderPanel();
            };
          });
          P.querySelectorAll("[data-town]").forEach((btn) => {
            btn.onclick = () => openTown(towns.find((t) => t.name === btn.dataset.town));
          });
          P.querySelectorAll("[data-prec]").forEach((btn) => {
            btn.onclick = () => openPrec(precs[+btn.dataset.prec]);
          });
          P.querySelectorAll(".tw[data-i]").forEach((btn) => {
            btn.onclick = () => openBlk(blocks[+btn.dataset.i]);
          });
          // hovering a ranking row acts like hovering that place on the map (no panning)
          P.querySelectorAll(".towns .tw").forEach((row) => {
            const obj = () =>
              row.dataset.town ? towns.find((t) => t.name === row.dataset.town)
                : row.dataset.prec != null ? precs[+row.dataset.prec]
                : row.dataset.i != null ? blocks[+row.dataset.i] : null;
            row.onmouseenter = () => {
              const o = obj();
              if (!o) return;
              hoverObj = o;
              previewCard(o);
              drawHighlights(hoverFor(o, S.state >= 2));
              const c = map.latLngToContainerPoint((o.bounds || L.latLngBounds(o.ll)).getCenter());
              const size = map.getSize();
              if (c.x > 0 && c.y > 0 && c.x < size.x - rpWidth() && c.y < size.y) {
                const r = document.getElementById("mapwrap").getBoundingClientRect();
                tipShow({ clientX: r.left + c.x, clientY: r.top + c.y }, describe(o), barFor(o));
              } else tipHide();
            };
            row.onmouseleave = () => {
              hoverObj = null;
              tipHide();
              drawHighlights();
              previewCard(null);
            };
          });
        }

        /* ---------- rolling number (odometer) ----------
           roll(el, from, to): each digit scrolls up when the value rises and
           down when it falls. Reduced motion: the number just switches. */
        const LAST = {}; // last value shown per rolling figure (carbon, parts, blocks, flats)
        function rollKey(key, el, to) {
          if (!el) return;
          roll(el, LAST[key], to);
          LAST[key] = to;
        }
        function roll(el, from, to) {
          const str = fmt(to);
          el.classList.add("odo");
          if (from == null || from === to || reduce) {
            el.textContent = str;
            return;
          }
          const lh = parseFloat(getComputedStyle(el).lineHeight) || el.offsetHeight || 20;
          el.style.setProperty("--lh", lh + "px");
          const up = to > from;
          const oldDigits = String(Math.round(from)).split("").reverse(); // ones first
          let k = (str.match(/\d/g) || []).length; // digit positions counted from the right
          el.innerHTML = list(str.split(""), (ch) => {
            if (!/\d/.test(ch)) return `<span class="sep">${ch}</span>`;
            k--;
            const o = +(oldDigits[k] ?? 0), n = +ch;
            // column 0–9 three times; start on the middle copy, end above or below it
            const start = 10 + o;
            const end = o === n ? start : up ? (n > o ? 10 + n : 20 + n) : (n < o ? 10 + n : n);
            return `<span class="dg"><span class="col" style="transform:translateY(${-start * lh}px)" data-end="${end}">${list([...Array(30).keys()], (i) => `<span>${i % 10}</span>`)}</span></span>`;
          });
          el.getBoundingClientRect(); // apply the start position before animating
          el.querySelectorAll(".col").forEach((c) => {
            c.classList.add("go");
            c.style.transform = `translateY(${-c.dataset.end * lh}px)`;
          });
          clearTimeout(el._t);
          el._t = setTimeout(() => (el.textContent = str), 700); // tidy up to plain text afterwards
        }

        /* ---------- RIGHT PANEL ---------- */
        // colour + icon for each facility group (one palette for facilities only)
        const GROUP_ICON = { t: "mrt", s: "school", c: "hawker", h: "clinic", p: "park" };
        const groupColour = (g) => T.amen[Object.keys(AM).find((k) => AM[k].grp === g)].color;
        const famk = (g, k) =>
          `<span class="amk" style="background:${groupColour(g)}">${icon(k || GROUP_ICON[g], 14)}</span>`;

        /* ---------- the right panel card ----------
           It describes the current selection, or (while hovering) what the pointer
           is on: a town, a precinct or a block. Carbon, blocks, flats, floors and
           towns / precincts roll to their new values; the lease bar slides. */
        function selTarget() {
          if (S.state === 0) return { kind: "island" };
          if (S.state === 1) return { kind: "town", o: S.town };
          if (S.state === 2) return { kind: "prec", o: precs[S.prec] };
          return { kind: "blk", o: S.blk };
        }
        function hoverTarget(o) {
          if (!o || outside(o)) return null;
          if (o.kind === "town" || o.kind === "prec") return { kind: o.kind, o };
          if (o.b != null) return { kind: "blk", o };
          return null;
        }
        let cardKey = null;
        function previewCard(o) {
          if (!rpOpen || !RP.querySelector("#rcard")) return;
          renderCard(hoverTarget(o) || selTarget());
        }
        const CO2_LINE = "Footprint area × floors × 1,300 kg CO₂e per m²";
        const CO2_NOTE = "Upfront carbon only (A1–A5). Every floor counted as the full footprint; basements and foundations not included.";
        function renderCard(t, force) {
          const box = RP.querySelector("#rcard");
          if (!box) return;
          const key = t.kind + ":" + (t.o ? (t.o.i ?? t.o.id ?? t.o.name) : "sg");
          if (key === cardKey && !force) return;
          cardKey = key;
          const info = (ex) => `
            <div class="cinfo" id="cinfo" role="tooltip">
              <b>How this is estimated</b>
              <span>${CO2_LINE}</span>
              <span class="ex">${ex}</span>
              <span class="cv">${CO2_NOTE}</span>
            </div>`;
          const carbonRow = (label, ex) => `
            <p class="clbl">${label} <span class="ii" aria-hidden="true">ⓘ</span></p>
            <div class="cnum" tabindex="0" aria-describedby="cinfo"><span class="ct-n" id="r-carbon"></span> <span class="ct-u">t CO₂e</span>${info(ex)}</div>`;

          if (t.kind === "blk") {
            // ---- one block ----
            const p = t.o, pr = precs[p.pid];
            const used = p.ls == null ? null : NOW - p.ls;
            const pct = used == null ? 0 : Math.max(0, Math.min(100, (used / 70) * 100));
            const val = used == null ? "No lease (HDB rental)" : used >= 70 ? "VERS-eligible now" : `${used} / 70 yrs`;
            const fp = p.gfa && p.f ? p.gfa / p.f : null;
            const ex = p.ec != null && fp
              ? `Blk ${p.b}: ${fmt(fp)} m² × ${p.f} floors = ${fmt(p.gfa)} m² GIA × 1.3 t/m² ≈ ${fmt(p.ec)} t CO₂e`
              : "Not calculated for this block.";
            box.innerHTML = `
              <div class="box cbox summary">
                <h3 class="title">Blk ${p.b}</h3>
                <p class="cprec">Precinct: ${pr.short}</p>
                <div class="clease">
                  <p class="clbl">Lease used till VERS-eligible</p>
                  <div class="trow"><span class="tk"><i id="r-lease" style="width:${LAST.lease ?? pct}%;background:${CB[p.band] || "#999"}"></i></span><span class="tv">${val}</span></div>
                </div>
                ${carbonRow("Approximate embodied carbon", ex)}
                <dl>
                  <dt>Block type</dt><dd><span class="sw sm" style="background:${p.ty == null ? "transparent" : CT[p.ty]}"></span>${p.ty == null ? "Type unknown" : TYP[p.ty].name}</dd>
                  <dt>Floors</dt><dd><span id="r-floors"></span></dd>
                  <dt>Flats</dt><dd><span id="r-flats"></span></dd>
                  <dt>Year built</dt><dd>${p.y || "—"}</dd>
                </dl>
              </div>`;
            rollKey("carbon", box.querySelector("#r-carbon"), p.ec || 0);
            rollKey("floors", box.querySelector("#r-floors"), p.f || 0);
            rollKey("flats", box.querySelector("#r-flats"), p.u || 0);
            const bar = box.querySelector("#r-lease");
            bar.getBoundingClientRect();
            bar.style.width = pct + "%"; // slides from the last block's position
            LAST.lease = pct;
            return;
          }

          // ---- a place: Singapore, a town or a precinct ----
          const bl = t.kind === "island" ? blocks : t.o.blocks;
          const shown = bl.filter((p) => visible(p)); // follows the checkboxes, like the map
          const yrs = bl.map((p) => p.y).filter((y) => y).sort((a, b) => a - b);
          const built = yrs.length
            ? `${yrs[0]}${when(yrs.at(-1) !== yrs[0], "–" + yrs.at(-1))} · median ${yrs[Math.floor(yrs.length / 2)]}`
            : "—";
          let parts = null;
          if (t.kind === "island") parts = { label: "Towns", n: towns.length, tag: "" };
          if (t.kind === "town")
            parts = { label: "Precincts", n: precs.filter((p) => p && p.town === t.o.name).length, tag: ' <span class="tag">derived</span>' };
          const name = t.kind === "island" ? "Singapore" : t.kind === "town" ? t.o.name : precTitle(t.o);
          box.innerHTML = `
            <div class="box cbox summary">
              <h3 class="title">${name}</h3>
              ${carbonRow("Approximate total embodied carbon", `Sum of the ${fmt(shown.length)} blocks shown on the map.`)}
              <dl>
                ${parts ? `<dt>${parts.label}</dt><dd><span id="r-parts"></span>${parts.tag}</dd>` : ""}
                <dt>Blocks</dt><dd><span id="r-blocks"></span></dd>
                <dt>Flats</dt><dd><span id="r-flats"></span></dd>
                <dt>Year built</dt><dd>${built}</dd>
              </dl>
            </div>`;
          rollKey("carbon", box.querySelector("#r-carbon"), sum(shown, (p) => p.ec));
          if (parts) rollKey("parts", box.querySelector("#r-parts"), parts.n);
          rollKey("blocks", box.querySelector("#r-blocks"), shown.length);
          rollKey("flats", box.querySelector("#r-flats"), sum(shown, (p) => p.u));
        }

        /* ---------- breadcrumb list (right panel, under the navigator) ----------
           One line per scale; each new scale opens below the one before. */
        let lastCrumbDepth = 0;
        function crumbList() {
          const items = [["Singapore", 0]];
          if (S.state >= 1) items.push([S.town.name, 1]);
          if (S.state >= 2) items.push([precTitle(precs[S.prec]), 2]);
          if (S.state >= 3) items.push(["Blk " + S.blk.b, 3]);
          const html = `
            <div class="crumbl">
              <ol>
                ${list(items, ([t, sc], i) => `
                  <li class="${when(i === items.length - 1, "cur")} ${when(i > lastCrumbDepth, "new")}" style="--d:${i}">
                    ${i === items.length - 1 ? `<span aria-current="location">${t}</span>` : `<button data-go="${sc}">${t}</button>`}
                  </li>`)}
              </ol>
            </div>`;
          lastCrumbDepth = items.length - 1;
          return html;
        }

        /* ---------- Nearest pop-out (bottom right of the map, precinct scale) ---------- */
        let nearMin = false;
        function renderNearest(html) {
          const box = document.getElementById("nearbox");
          box.classList.toggle("open", !!html);
          box.classList.toggle("min", nearMin);
          box.innerHTML = html || "";
          if (!html) return;
          box.querySelector("#nbToggle").onclick = () => {
            nearMin = !nearMin;
            renderPanel();
          };
          // hovering a row highlights that facility on the map
          box.querySelectorAll("[data-ll]").forEach((row) => {
            const key = row.dataset.ll;
            row.onmouseenter = () => amenLayer.eachLayer((m) => {
              const ll = m.getLatLng && m.getLatLng();
              if (ll && `${ll.lat},${ll.lng}` === key) m.getElement()?.classList.add("hl");
            });
            row.onmouseleave = () => amenLayer.eachLayer((m) => m.getElement()?.classList.remove("hl"));
          });
        }

        function panelRight() {
          const app = document.getElementById("app");
          app.classList.toggle("rp-open", rpOpen);
          renderCrumbs();
          if (!rpOpen) {
            RP.innerHTML = "";
            cardKey = null;
            renderNearest("");
            return;
          }
          // precinct extras
          let extras = "", nearestHTML = "";
          if (S.state === 2) {
            const pr = precs[S.prec];
            const years = pr.blocks.map((p) => p.y).sort((a, b) => a - b);
            const medianYear = years[Math.floor(years.length / 2)];
            const radii = ringRadii();
            const R2 = radii[radii.length - 1];
            const nearEach = radii.map((r) => near(pr, r));
            const nearOuter = nearEach[nearEach.length - 1];
            const countGroup = (group, found) =>
              Object.keys(AM).filter((k) => AM[k].grp === group).reduce((s, k) => s + found[k].length, 0);
            const nearestRow = (k, label) => {
              const x = nearOuter[k][0];
              return x
                ? `<div data-ll="${x.a[1]},${x.a[0]}"><span>${famk(AM[k].grp, k)}${x.a[2] || label}</span><span>${Math.round(x.d)} m · ${walkMin(x.d)} min</span></div>`
                : `<div><span>${famk(AM[k].grp, k)}${label}</span><span>none within ${fmt(R2)} m</span></div>`;
            };
            const cols = `grid-template-columns:1fr repeat(${radii.length}, 56px)`;
            extras = `
              <section>
                <p class="lbl"><span>History and maturity of neighbourhood</span></p>
                <div class="ph"><b>Precinct photo</b> — ${pr.site ? "add an aerial or street photo of this site" : "add a photo for this precinct"}</div>
                <div class="box" style="margin-top:2px">
                  <dl style="margin:0">
                    <dt>Neighbourhood age</dt> <dd>${NOW - medianYear} years <span class="muted">(median block built ${medianYear})</span></dd>
                  </dl>
                </div>
                <div class="ph" style="margin-top:2px"><b>Your text here</b> — the history of this neighbourhood, from your oral histories and textual research.</div>
              </section>

              <section>
                <p class="lbl"><span>Neighbourhood facilities</span></p>
                <div class="fachead" style="${cols}"><span></span>${list(radii, (r) => `<span>${fmt(r)} m</span>`)}</div>
                <div class="facgrid">
                  ${list(GROUPS, ([group, name]) => `
                    <label class="fac" style="${cols}">
                      <span class="fn"><input type="checkbox" data-f="${group}" ${when(S.fac[group], "checked")}>${famk(group)}${name}</span>
                      ${list(nearEach, (found) => `<span class="fc">${countGroup(group, found)}</span>`)}
                    </label>`)}
                </div>
              </section>`;
            nearestHTML = `
              <button class="nb-head" id="nbToggle" aria-expanded="${!nearMin}">
                <span><b>Nearest</b> · walk at 80 m/min</span>${icon(nearMin ? "chevup" : "chevdown", 16)}
              </button>
              <div class="near">
                ${nearestRow("mrt", "MRT / LRT")}
                ${nearestRow("hawker", "Hawker centre")}
                ${nearestRow("school", "School")}
                ${nearestRow("clinic", "Clinic")}
                ${nearestRow("park", "Park")}
              </div>`;
          }

          // --- HTML ---
          RP.innerHTML = `
            <div class="rphead">
              <div class="scaleind">
                <span class="sqs">
                  ${list(SCALES, (name, i) => `
                    <button class="sq ${when(i === S.state, "on")}" data-scale="${i}" style="--s:${[16, 12, 9, 6][i]}px"
                      ${when(i > S.state, "disabled")} aria-label="${name} scale" ${when(i === S.state, 'aria-current="true"')}></button>`)}
                </span>
                <span class="scname">${SCALES[S.state]} scale</span>
              </div>
              <button class="iconbtn" id="rpClose" aria-label="Close the details panel">${icon("close", 16)}</button>
            </div>
            <div class="navbox" title="Preview: the white box is what the map is showing"><canvas id="navCanvas"></canvas></div>
            <div id="rcard"></div>
            ${extras}`;

          // --- wire up ---
          renderCard(hoverTarget(hoverObj) || selTarget(), true);
          renderNearest(nearestHTML);
          RP.querySelectorAll("[data-scale]").forEach((btn) => {
            btn.onclick = () => +btn.dataset.scale < S.state && go(+btn.dataset.scale);
          });
          RP.querySelector("#rpClose").onclick = () => {
            rpOpen = false;
            renderPanel();
            drawNav();
          };
          RP.querySelectorAll(".fac input[data-f]").forEach((btn) => {
            btn.onchange = () => {
              S.fac[btn.dataset.f] = btn.checked;
              drawHighlights();
              renderPanel();
            };
          });
          drawNav();
        }
        document.getElementById("rpTab").onclick = () => {
          rpOpen = true;
          renderPanel();
        };

        /* ---------- navigator (top of the right panel) ----------
           The island, centred with even margins, and one box showing exactly
           what the map is showing (the part not hidden by the right panel). */
        let navRings = null;
        function drawNav() {
          const cv = document.getElementById("navCanvas");
          if (!cv || !map) return;
          const dpr = window.devicePixelRatio || 1;
          const W = cv.clientWidth, H = cv.clientHeight;
          if (!W || !H) return;
          if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
          const g = cv.getContext("2d");
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (!navRings) navRings = D.sub.flatMap(([n, pa, r]) => decode(r));
          const b = baseLayer.getBounds();
          const kx = Math.cos((1.35 * Math.PI) / 180); // shrink longitude to keep the island's shape
          const bw = (b.getEast() - b.getWest()) * kx, bh = b.getNorth() - b.getSouth();
          const m = 14;
          const s = Math.min((W - 2 * m) / bw, (H - 2 * m) / bh);
          const ox = (W - bw * s) / 2, oy = (H - bh * s) / 2;
          const Pt = (lat, lng) => [ox + (lng - b.getWest()) * kx * s, H - oy - (lat - b.getSouth()) * s];
          g.clearRect(0, 0, W, H);
          g.fillStyle = T.base.dark.water;
          g.fillRect(0, 0, W, H);
          g.fillStyle = NIGHT_ON ? "#3A3A3D" : T.base.dark.land;
          navRings.forEach((ring) => {
            g.beginPath();
            ring.forEach((p, i) => {
              const [x, y] = Pt(p[0], p[1]);
              i ? g.lineTo(x, y) : g.moveTo(x, y);
            });
            g.fill();
          });
          // the view box
          const size = map.getSize();
          const hidden = rpWidth();
          const nw = map.containerPointToLatLng([0, 0]);
          const se = map.containerPointToLatLng([Math.max(1, size.x - hidden), size.y]);
          const [x0, y0] = Pt(nw.lat, nw.lng), [x1, y1] = Pt(se.lat, se.lng);
          const cx0 = Math.max(1, Math.min(x0, x1)), cy0 = Math.max(1, Math.min(y0, y1));
          const cx1 = Math.min(W - 1, Math.max(x0, x1)), cy1 = Math.min(H - 1, Math.max(y0, y1));
          g.strokeStyle = NIGHT_ON ? "#FFFFFF" : T.ui.text;
          g.lineWidth = 1.5;
          g.strokeRect(cx0, cy0, Math.max(2, cx1 - cx0), Math.max(2, cy1 - cy0));
        }
        // width of the map hidden behind the right panel (0 when closed or on phones)
        function rpWidth() {
          const rp = document.getElementById("rpanel");
          return rpOpen && getComputedStyle(rp).position === "absolute" ? rp.offsetWidth : 0;
        }

        /* ---------- BLOCK CARD (bottom centre, block scale) ---------- */

        // Placeholder flat sizes and prices (from the mock-up) — replace with real data later
        const FLAT = {
          "3-room": { fa: 69, ifa: 66, lo: 297000, hi: 355000 },
          "4-room": { fa: 90, ifa: 86, lo: 420000, hi: 510000 },
          "5-room": { fa: 110, ifa: 105, lo: 530000, hi: 640000 },
        };
        let flatType = "3-room";

        // Simulated starting vote numbers for a block (made up, but the same every time)
        function seedTally(p) {
          const h = hash(p.s + p.b);
          const n = precs[p.pid].site ? 340 : Math.round(80 + h * 320);
          const cash = Math.round(n * (0.25 + h * 0.2));
          const adapt = Math.round(n * (0.35 - h * 0.1));
          return { n, cash, adapt, harvest: n - cash - adapt };
        }

        // This visitor's own vote, saved in their browser
        function loadVote(p) {
          try {
            return JSON.parse(localStorage.getItem("rto-vote-" + p.s + "-" + p.b) || "null");
          } catch (e) {
            return null;
          }
        }

        function renderBlockCard() {
          const mw = document.getElementById("mapwrap");
          const on = S.state === 3 && S.blk;
          mw.classList.toggle("has-card", !!on);
          CARD.classList.toggle("open", !!on);
          CARD.setAttribute("aria-hidden", String(!on));
          if (!on) return;
          // --- numbers ---
          const p = S.blk;
          const flat = FLAT[flatType];
          const tally = seedTally(p);
          const myVote = loadVote(p);
          const leaseUsed = p.ls == null ? 0 : Math.max(0, Math.min(100, ((NOW - p.ls) / 99) * 100)); // % of the 99 years
          const leaseText = p.ls == null
            ? "HDB-owned rental — no lease sold"
            : `Lease ${p.ls}–${p.ls + 99} · ${NOW - p.ls} of 99 years used · VERS-eligible <b>${p.ls + 70}</b>`;
          const carbonHtml = p.ec != null
            ? `
              <div class="carbon">
                <div><b>${fmt(p.ec)} t</b><small>CO₂e embodied — lost if demolished</small></div>
                <div><b>${fmt(p.gfa)} m²</b><small>Gross internal area</small></div>
                <div><b>${fmt((p.ec / p.gfa) * 1000)} kg</b><small>CO₂e per m² GIA</small></div>
                <div><b>${fmt(p.ec / Math.max(1, p.u))} t</b><small>CO₂e per flat</small></div>
              </div>`
            : `<p class="nodata">Not calculated for this block.</p>`;

          // --- HTML ---
          CARD.classList.toggle("min", cardMin);
          CARD.innerHTML = `
            <div class="bc-head">
              <div class="bc-id">
                <h3>Blk ${p.b} ${tc(p.s)}</h3>
                <p class="dek">${p.t} · Singapore ${p.pc} · ${p.ty == null ? "Type unknown" : TYP[p.ty].name}${when(p.era, " · era " + p.era)}${when(p.sers, " · <b>" + p.sers + "</b>")}</p>
                <div class="clock">${when(p.ls != null, `<i style="width:${leaseUsed}%;background:${CB[p.band]}"></i>`)}</div>
                <p class="dek small">${leaseText}</p>
              </div>
              <button class="iconbtn" id="bcMin" aria-expanded="${!cardMin}" aria-label="${cardMin ? "Expand" : "Collapse"} block details">${icon(cardMin ? "chevup" : "chevdown", 18)}</button>
            </div>
            <div class="bc-body">
              <section>
                <p class="lbl"><span>Prices / flat details</span><span class="tag">illustrative</span></p>
                <select id="flatType" aria-label="Flat type">
                  ${list(Object.keys(FLAT), (k) => `<option ${when(k === flatType, "selected")}>${k}</option>`)}
                </select>
                <div class="box" style="margin-top:2px">
                  <dl style="margin:0">
                    <dt>Est. floor area</dt>          <dd>${flat.fa} sqm</dd>
                    <dt>Est. internal floor area</dt> <dd>${flat.ifa} sqm</dd>
                    <dt>Flats in block</dt>           <dd>${fmt(p.u)} · ${p.f} storeys${when(p.upf, " · " + Math.round(p.upf) + "/floor")}</dd>
                  </dl>
                  <p class="lbl" style="margin:16px 0 0"><span>Indicative price range</span></p>
                  <div class="price">$${fmt(flat.lo)} – $${fmt(flat.hi)}</div>
                  <p class="dek small">Placeholder from your mock-up until resale data and your RTO pricing model are added.</p>
                </div>
              </section>
              <section>
                <p class="lbl"><span>Embodied carbon stats</span>${when(p.ec != null, '<span class="tag">your QGIS calc</span>')}</p>
                ${carbonHtml}
                <p class="dek small" style="margin-top:8px">Material recovery → concrete recovery quantity: to come. Dashed lines on the map: neighbouring blocks that could share materials.</p>
              </section>
            </div>
            <div class="bc-foot">
              <div class="bc-count">
                <span class="clbl">RTO applicants</span>
                <b>${fmt(tally.n + (myVote ? 1 : 0))}</b>
                ${when(myVote, `<span class="dek small">You voted: <b class="accent-txt">${myVote?.choice}</b></span>`)}
              </div>
              <button class="cta apply" id="applyBtn">${myVote ? "Review your RTO application" : "Apply for RTO"} ${icon("arrow", 18)}</button>
            </div>`;

          // --- wire up ---
          CARD.querySelector("#bcMin").onclick = () => {
            cardMin = !cardMin;
            renderBlockCard();
            requestAnimationFrame(layoutTop);
          };
          CARD.querySelector("#flatType").onchange = (e) => {
            flatType = e.target.value;
            renderBlockCard();
          };
          CARD.querySelector("#applyBtn").onclick = openDrawer;
        }

        /* =========================================================
           RTO FORM (slides up from the bottom of the screen, out of the block card)
           Steps follow the mind map:
             intro → role → (resident: cash out or join?) → (join / new: adapt or harvest?) → result
           ========================================================= */
        const drawer = document.getElementById("drawer");
        let drawerOpen = false;
        let F = {}; // answers so far

        // The mind-map diagram shown on the first step (spacing matters — keep it as is)
        const MINDMAP = (n) => [
          `RTO Applicants: ${n}`,
          `        │`,
          `    Voting form`,
          `     ├── Present resident ─┬─ Cash out?`,
          `     │                     └─ Join RTO? ─┐`,
          `     └── New applicant ────── Join RTO? ─┤`,
          `                                    Adapt · Harvest`,
        ].join("\n");

        function openDrawer() {
          F = { step: 0, role: null, choice: null, future: null, unit: "", ftype: "3-room", hh: "2" };
          drawerOpen = true;
          drawer.classList.add("open");
          drawer.setAttribute("aria-hidden", "false");
          document.getElementById("scrim").classList.add("on");
          renderForm();
          setTimeout(() => drawer.querySelector("#fClose")?.focus(), 250);
        }
        function closeDrawer() {
          drawerOpen = false;
          drawer.classList.remove("open");
          drawer.setAttribute("aria-hidden", "true");
          document.getElementById("scrim").classList.remove("on");
        }
        document.getElementById("scrim").onclick = () => {
          closeDrawer();
          renderPanel();
        };

        // Which steps this visitor will see, given their answers so far
        function flow() {
          const steps = ["intro", "role"];
          if (F.role === "resident") steps.push("resident");
          if (F.role === "new" || F.choice === "join") steps.push("future");
          steps.push("result");
          return steps;

          })
          .catch((e) => {
            console.error(e);
            P.innerHTML = "<p>The map data did not load. Reload the page to try again.</p>";
          });
      })();
    </script>
  </body>
</html>
