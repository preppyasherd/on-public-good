              </select>
              <div class="box" style="margin-top:8px">
                <dl>
                  <dt>Est. floor area</dt>          <dd>${flat.fa} sqm</dd>
                  <dt>Est. internal floor area</dt> <dd>${flat.ifa} sqm</dd>
                  <dt>Flats in block</dt>           <dd>${fmt(p.u)} · ${p.f} storeys${when(p.upf, " · " + p.upf + "/floor")}</dd>
                </dl>
                <p class="lbl" style="margin:12px 0 2px"><span>Indicative price range</span></p>
                <div class="price">$${fmt(flat.lo)} – $${fmt(flat.hi)}</div>
                <p class="dek" style="font-size:12px">Placeholder from your mock-up until resale data and your RTO pricing model are added.</p>
              </div>
            </section>

            <section>
              <p class="lbl"><span>Embodied carbon stats</span>${when(p.ec != null, '<span class="tag">your QGIS calc</span>')}</p>
              ${carbonHtml}
              <p class="dek" style="font-size:12px;margin-top:6px">Material recovery → concrete recovery quantity: to come. Dashed lines on the map: neighbouring blocks that could share materials.</p>
            </section>

            <section class="box" style="text-align:center">
              <p class="lbl" style="justify-content:center"><span>RTO applicants</span></p>
              <div class="big-num">${fmt(tally.n + (myVote ? 1 : 0))}</div>
              ${when(myVote, `<p class="dek" style="font-size:12px">You voted: <b class="accent-txt">${myVote?.choice}</b></p>`)}
            </section>

            <button class="cta apply" id="applyBtn">${myVote ? "Review your RTO application" : "Apply for RTO"} ${icon("arrow", 18)}</button>

            <section>
              <p class="lbl"><span>Other blocks here</span></p>
              <div class="blklist">
                ${list(pr.blocks.filter((b) => b !== p), (b) => `<button data-i="${b.i}"><i style="background:${CB[b.band]}"></i>${b.b}</button>`)}
              </div>

          // --- wire up ---
          P.querySelector("#flatType").onchange = (e) => {

          };
          P.querySelector("#applyBtn").onclick = openDrawer;
          P.querySelectorAll(".blklist button").forEach((btn) => {
            btn.onclick = () => openBlk(blocks[+btn.dataset.i]);
          });
        }

        /* =========================================================
           RTO FORM (the white drawer that slides in from the right)
           Steps follow the mind map:
             intro → role → (resident: cash out or join?) → (join / new: adapt or harvest?) → result
           ========================================================= */
        const drawer = document.getElementById("drawer");
        let drawerOpen = false;
        let F = {}; // answers so far

        // The mind-map diagram shown on the first step (spacing matters — keep it as is)
        const MINDMAP = (n) => [
          `RTO Applicants: ${n}`,
          `        │`,
          `    Voting form`,
          `     ├── Present resident ─┬─ Cash out?`,
          `     │                     └─ Join RTO? ─┐`,
          `     └── New applicant ────── Join RTO? ─┤`,
          `                                    Adapt · Harvest`,
        ].join("\n");

        function openDrawer() {
          F = { step: 0, role: null, choice: null, future: null, unit: "", ftype: "3-room", hh: "2" };
          drawerOpen = true;
          drawer.classList.add("open");
          drawer.setAttribute("aria-hidden", "false");
          renderForm();
        }
        function closeDrawer() {
          drawerOpen = false;
          drawer.classList.remove("open");
          drawer.setAttribute("aria-hidden", "true");
        }

        // Which steps this visitor will see, given their answers so far
        function flow() {
          const steps = ["intro", "role"];
          if (F.role === "resident") steps.push("resident");
          if (F.role === "new" || F.choice === "join") steps.push("future");
          steps.push("result");
          return steps;
        }

        function renderForm() {
          const p = S.blk;
          const tally = seedTally(p);
          const steps = flow();
          const step = steps[F.step];

          // illustrative VERS payout for a 3-room flat (Bala's Table-style curve at ~29 years left)
          const yearsLeft = p.ls == null ? null : p.ls + 99 - NOW;
          const payout = yearsLeft == null
            ? null
            : Math.round((FLAT["3-room"].hi * (1 - Math.pow(1.035, -29))) / (1 - Math.pow(1.035, -Math.max(29, yearsLeft))) / 1000);

          let body = "";
          let canContinue = true;

          if (step === "intro") {
            body = `
              <h5>Retrofit-To-Order</h5>
              <p>Blk ${p.b} ${tc(p.s)} becomes VERS-eligible in <b>${p.ls == null ? "—" : p.ls + 70}</b>.
                Under VERS, residents may vote to cash out and the block is demolished${when(p.ec != null, ` — losing <b>${fmt(p.ec)} t CO₂e</b> of embodied carbon`)}.
                Retrofit-To-Order asks residents and new applicants to decide its future together:
                <b>adapt</b> it in place, or <b>harvest</b> its materials for a neighbouring block.</p>
              <p><b>${fmt(tally.n)}</b> people have applied so far.</p>
              <div class="mindmap">${MINDMAP(tally.n)}</div>`;
          }

          if (step === "role") {
            canContinue = !!F.role;
            body = `
              <h5>Who are you?</h5>
              <p>Your answer decides which questions come next.</p>
              <button class="opt" data-role="resident" aria-pressed="${F.role === "resident"}">
                <b>Present resident</b><small>You own or live in a flat in Blk ${p.b}</small>
              </button>
              <button class="opt" data-role="new" aria-pressed="${F.role === "new"}">
                <b>New applicant</b><small>You'd like to buy into this block once it is retrofitted</small>
              </button>
              ${when(F.role === "resident", `
                <label class="fld">Unit number (for the simulation — not checked)
                  <input id="unit" placeholder="#08-123" value="${F.unit}">
                </label>`)}
              ${when(F.role === "new", `
                <label class="fld">Preferred flat type
                  <select id="ftype">${list(Object.keys(FLAT), (k) => `<option ${when(k === F.ftype, "selected")}>${k}</option>`)}</select>
                </label>
                <label class="fld">Household size
                  <select id="hh">${list([1, 2, 3, 4, 5, "6+"], (k) => `<option ${when(String(k) === F.hh, "selected")}>${k}</option>`)}</select>
                </label>`)}`;
          }

          if (step === "resident") {
            canContinue = !!F.choice;
            body = `
              <h5>Cash out, or join RTO?</h5>
              <p>Estimates for a 3-room flat — illustrative until your financial model is added.</p>
              <button class="opt" data-ch="cash" aria-pressed="${F.choice === "cash"}">
                <span class="fig">${payout ? "~$" + payout + "k" : "—"}</span>
                <b>Cash out under VERS</b>
                <small>Sell back at year 70; the block is demolished. Payout follows Bala's Table at ~29 years left.</small>
              </button>
              <button class="opt" data-ch="join" aria-pressed="${F.choice === "join"}">
                <span class="fig">stay</span>
                <b>Join Retrofit-To-Order</b>
                <small>Keep your home through the works and help decide what happens to the block.</small>
              </button>`;
          }

          if (step === "future") {
            canContinue = !!F.future;
            body = `
              <h5>What should happen to Blk ${p.b}?</h5>
              <p>Compare the two futures.</p>
              <button class="opt" data-fu="adapt" aria-pressed="${F.future === "adapt"}">
                <span class="fig">${when(p.ec != null, fmt(p.ec) + " t CO₂e kept")}</span>
                <b>Adapt</b>
                <small>Retrofit in place: new services, layouts and lifts; the concrete frame and its embodied carbon stay.</small>
              </button>
              <button class="opt" data-fu="harvest" aria-pressed="${F.future === "harvest"}">
                <span class="fig">to come</span>
                <b>Harvest</b>
                <small>Carefully dismantle and reuse components in a neighbouring block (red dashed lines on the map). Recovery quantity to come from your calculator.</small>
              </button>`;
          }

          if (step === "result") {
            const choice = F.choice === "cash" ? "Cash out" : F.future === "adapt" ? "Adapt" : "Harvest";
            try {
              localStorage.setItem("rto-vote-" + p.s + "-" + p.b, JSON.stringify({ choice, role: F.role }));
            } catch (e) {}

            // add this vote to the simulated totals
            const T = {
              cash: tally.cash + (choice === "Cash out"),
              adapt: tally.adapt + (choice === "Adapt"),
              harvest: tally.harvest + (choice === "Harvest"),
            };
            const total = T.cash + T.adapt + T.harvest;
            const bar = (k, colour) => `<i style="width:${(T[k] / total) * 100}%;background:${colour}">${Math.round((T[k] / total) * 100)}%</i>`;

          }

          const nextLabel = step === "result" ? "Done" : step === "intro" ? "Start" : "Next →";
          drawer.innerHTML = `
            <header>
              <h4>Apply for RTO · Blk ${p.b}</h4>

            </header>
            <div class="dots">${list(steps, (_, i) => `<i class="${i <= F.step ? "on" : ""}"></i>`)}</div>
            <div class="fbody">${body}</div>
            <div class="ffoot">
              <button class="bk" id="fBack" ${when(F.step === 0, 'style="visibility:hidden"')}>← Back</button>
              <button class="nx" id="fNext" ${when(!canContinue, "disabled")}>${nextLabel}</button>
            </div>`;

          // --- wire up ---
          drawer.querySelector("#fClose").onclick = () => {
            closeDrawer();
            renderPanel();
          };
          drawer.querySelector("#fBack").onclick = () => {
            F.step = Math.max(0, F.step - 1);

          };
          drawer.querySelector("#fNext").onclick = () => {
            if (step === "result") {
              closeDrawer();
              renderPanel();

            }
            F.step++;
            renderForm();
          };
          drawer.querySelectorAll("[data-role]").forEach((btn) => {
            btn.onclick = () => {
              F.role = btn.dataset.role;
              F.choice = null;
              F.future = null;
              renderForm();
            };
          });
          drawer.querySelectorAll("[data-ch]").forEach((btn) => {
            btn.onclick = () => {
              F.choice = btn.dataset.ch;
              renderForm();
            };
          });
          drawer.querySelectorAll("[data-fu]").forEach((btn) => {
            btn.onclick = () => {
              F.future = btn.dataset.fu;
              renderForm();
            };
          });
          const unit = drawer.querySelector("#unit");
          if (unit) unit.oninput = () => (F.unit = unit.value);
          const ftype = drawer.querySelector("#ftype");
          if (ftype) ftype.onchange = () => (F.ftype = ftype.value);
          const hh = drawer.querySelector("#hh");
          if (hh) hh.onchange = () => (F.hh = hh.value);
        }

        /* ---------- style editor ---------- */
        const AMN = {
          mrt: "MRT / LRT",
          bus: "Bus stops",
          school: "Schools",
          pre: "Pre-schools",
          hawker: "Hawker / food centres",
          clinic: "CHAS clinics",
          park: "Parks (points)",
        };
        const FONTS_SERIF = [
          "IBM Plex Sans",
          "IBM Plex Serif",
          "Inter",
          "Helvetica",
          "Newsreader",
          "Source Serif 4",
          "Playfair Display",
          "Times New Roman",
        ];
        const FONTS_SANS = ["IBM Plex Sans", "Inter", "Helvetica", "IBM Plex Sans", "Space Grotesk", "Arial"];
        const FONTS_MONO = ["IBM Plex Mono", "Inter", "Helvetica"];
        const ED = [
          [
            "Interface",
            [
              ["Background", "ui.background", "color"],
              ["Text", "ui.text", "color"],
              ["Primary (buttons)", "ui.primary", "color"],
              ["Accent (hover)", "ui.accent", "color"],
              ["Surface (cards)", "ui.surface", "color"],
              ["Border", "ui.border", "color"],
              ["Heading font", "ui.serif", "select", FONTS_SERIF],
              ["Interface font", "ui.sans", "select", FONTS_SANS],
              ["Numbers font", "ui.mono", "select", FONTS_MONO],
              ["Panel text size", "ui.scale", "range", [0.8, 1.3, 0.05]],
            ],
          ],
          [
            "Base map — city scale (dark)",
            [
              ["Land", "base.dark.land", "color"],
              ["Subzone lines", "base.dark.line", "color"],
              ["Line opacity", "base.dark.lineOpacity", "range", [0, 1, 0.05]],
              ["Line weight", "base.dark.lineWeight", "range", [0, 2, 0.1]],
              ["Sea / background", "base.dark.water", "color"],
            ],
          ],
          [
            "Base map — precinct & project (light)",
            [
              ["Land", "base.light.land", "color"],
              ["Subzone lines", "base.light.line", "color"],
              ["Line opacity", "base.light.lineOpacity", "range", [0, 1, 0.05]],
              ["Line weight", "base.light.lineWeight", "range", [0, 2, 0.1]],
              ["Sea / background", "base.light.water", "color"],
            ],
          ],
          [
            "Years till VERS",
            [
              ...BANDS.map((b) => [bandLabel(b), "vers." + b.k, "color"]),
              ["HDB owned (rental)", "versRental", "color"],
            ],
          ],
          ["Block typology", TYP.map((t) => [t.name, "typ." + t.k, "color"])],
          [
            "Blocks",
            [
              ["Fill opacity", "blocks.opacity", "range", [0.1, 1, 0.05]],
              ["Filtered-out (dimmed) opacity", "blocks.dim", "range", [0, 1, 0.05]],
              ["Other precincts opacity", "blocks.context", "range", [0, 1, 0.05]],
              ["Outline when zoomed in", "blocks.outline", "color"],
              ["Outline weight", "blocks.outlineWeight", "range", [0, 3, 0.1]],
              ["Selected block outline", "blocks.selected", "color"],
              ["Selected outline weight", "blocks.selectedWeight", "range", [1, 6, 0.5]],
              ["SERS outline (dark map)", "blocks.sers", "color"],
            ],
          ],
          [
            "Hover & outlines",
            [
              ["Hover — dark map", "hover.dark", "color"],
              ["Hover — light map", "hover.light", "color"],
              ["Hover weight", "hover.weight", "range", [0.5, 5, 0.5]],
              ["Precinct outlines (town view)", "precinct.outline", "color"],
              ["Precinct outline opacity", "precinct.outlineOpacity", "range", [0, 1, 0.05]],
              ["Precinct outline (light map)", "precinct.light", "color"],
            ],
          ],
          [
            "RTO sites",
            [
              ["Outline site blocks", "sites.outline", "check"],
              ["Site outline colour", "sites.color", "color"],
              ["Site outline weight", "sites.weight", "range", [0.5, 4, 0.5]],
            ],
          ],
          [
            "Walking distance bands",
            [
              ["Show rings", "rings.show", "check"],
              ["Band spacing (m)", "rings.spacing", "range", [100, 1000, 50]],
              ["Number of bands", "rings.count", "range", [1, 6, 1]],
              ["Ring colour", "rings.color", "color"],
            ],
          ],
          [
            "Material recovery lines",
            [
              ["Colour", "recovery.color", "color"],
              ["Weight", "recovery.weight", "range", [0.5, 5, 0.5]],
            ],
          ],
          [
            "Parks",
            [
              ["Park fill", "parks.fill", "color"],
              ["Park opacity", "parks.opacity", "range", [0, 1, 0.05]],
              ["Park connector", "parks.connector", "color"],
              ["Connector weight", "parks.connectorWeight", "range", [0, 5, 0.5]],
            ],
          ],
          [
            "Amenities",
            [
              ...Object.keys(AMN).flatMap((k) => [
                [AMN[k], `amen.${k}.color`, "color"],
                [`Show ${AMN[k].toLowerCase()}`, `amen.${k}.show`, "check"],
              ]),
              ["Icon size", "amenSize.pin", "range", [16, 40, 2]],
              ["Dot size", "amenSize.dot", "range", [2, 10, 1]],
            ],
          ],
          [
            "Show on map",
            [
              ["Legend", "overlays.legend", "check"],
              ["Hint bubble", "overlays.hint", "check"],
              ["Locator map", "overlays.locator", "check"],
              ["Breadcrumb", "overlays.crumbs", "check"],
              ["Style button (press S to bring back)", "overlays.styleButton", "check"],
            ],
          ],
        ];
        const getP = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
        function setP(o, p, v) {
          const ks = p.split(".");
          const last = ks.pop();
          const t = ks.reduce((a, k) => a[k], o);
          t[last] = v;
        }
        let edOpen = false,
          pend = false;
        let framed = false;
        try {
          framed = window.self !== window.top;
        } catch (e) {
          framed = true;
        }
        document.getElementById("themeBtn").onclick = () => {
          NIGHT_ON = !NIGHT_ON;
          try {
            localStorage.setItem(THEME_KEY, NIGHT_ON ? "night" : "day");
          } catch (e) {}
          applyStyle();
        };
        function applyStyle() {
          if (pend) return;
          pend = true;
          requestAnimationFrame(() => {
            pend = false;
            recolor();
            if (!map) return;
            setBasemap(S.state >= 2);
            restyleParks();
            restyle();
            drawHighlights();
            renderLegend();
            renderPanel();
            renderLocator();
          });
        }
        function restyleParks() {
          parkPolys.forEach((l) =>
            l.setStyle({ fillColor: ST.parks.fill, fillOpacity: ST.parks.opacity }),
          );
          pcnLines.forEach((l) =>
            l.setStyle({
              color: ST.parks.connector,
              weight: ST.parks.connectorWeight,
              opacity: ST.parks.connectorWeight ? 0.8 : 0,
            }),
          );
        }
        function renderEditor() {
          const ed = document.getElementById("styleEd");
          // One row in the editor, for each kind of control
          const ctl = ([label, path, type, opt]) => {
            const v = getP(ST, path);
            const id = "st-" + path.replace(/\./g, "-");
            if (type === "color")
              return `
                <label class="er" for="${id}">
                  <span>${label}</span>
                  <span class="ec">
                    <input type="color" id="${id}" data-p="${path}" data-t="color" value="${v}">
                    <input type="text" data-p="${path}" data-t="hex" value="${v}" maxlength="7" aria-label="${label} hex">
                  </span>
                </label>`;
            if (type === "range")
              return `
                <label class="er" for="${id}">
                  <span>${label}</span>
                  <span class="ec">
                    <input type="range" id="${id}" data-p="${path}" data-t="range" min="${opt[0]}" max="${opt[1]}" step="${opt[2]}" value="${v}"><output>${v}</output>
                  </span>
                </label>`;
            if (type === "check")
              return `
                <label class="er" for="${id}">
                  <span>${label}</span>
                  <input type="checkbox" id="${id}" data-p="${path}" data-t="check" ${v ? "checked" : ""}>
                </label>`;
            if (type === "select")
              return `
                <label class="er" for="${id}">
                  <span>${label}</span>
                  <select id="${id}" data-p="${path}" data-t="select">
                    ${opt.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}
                  </select>
                </label>`;
          };

          ed.innerHTML = `
            <header>
              <b>Style editor</b>
              <button class="iconbtn" id="edClose" aria-label="Close style editor">${icon("close", 16)}</button>
            </header>
            <div class="etools">
              <button id="edCopy">Copy JSON</button>
              ${framed ? "" : '<button id="edDl">Download</button>'}
              <label class="eimp">Import<input type="file" id="edImp" accept=".json,application/json"></label>
              <button id="edReset">Reset</button>
            </div>
            <p class="enote" id="edNote">Changes show live and are saved in this browser. To make them permanent for everyone, ${framed ? "copy the JSON into" : "download"} <b>style.json</b> next to index.html. This editor changes the day style; night mode keeps its own fixed colours.</p>
            <div class="ebody">
              ${ED.map(([section, rows], i) => `
                <details ${i < 1 ? "open" : ""}>
                  <summary>${section}</summary>
                  ${rows.map(ctl).join("")}
                </details>`).join("")}
            </div>`;
          const note = (t) => {
            document.getElementById("edNote").textContent = t;
          };
          ed.querySelectorAll("[data-p]").forEach((el) => {
            const p = el.dataset.p,
              t = el.dataset.t;
            const set = (v) => {
              setP(ST, p, v);
              saveStyle();
              applyStyle();
              if (t === "color") {
                const h = ed.querySelector(`[data-p="${p}"][data-t="hex"]`);
                if (h) h.value = v;
              }
              if (t === "hex") {
                const c = ed.querySelector(`[data-p="${p}"][data-t="color"]`);
                if (c) c.value = v;
              }
              if (t === "range") el.nextElementSibling.textContent = v;
            };
            el.addEventListener("input", () => {
              if (t === "color") set(el.value);
              else if (t === "hex") {
                if (/^#[0-9a-f]{6}$/i.test(el.value)) set(el.value.toLowerCase());
              } else if (t === "range") set(+el.value);
              else if (t === "check") set(el.checked);
              else if (t === "select") set(el.value);
            });
            if (t === "check" || t === "select")
              el.addEventListener("change", () => set(t === "check" ? el.checked : el.value));
          });
          ed.querySelector("#edClose").onclick = toggleEditor;
          ed.querySelector("#edReset").onclick = () => {
            ST = clone(SITE_STYLE);
            try {
              localStorage.removeItem(STYLE_KEY);
            } catch (e) {}
            applyStyle();
            renderEditor();
            note("Reset to the site style.");
          };
          const json = () => JSON.stringify(ST, null, 2);
          ed.querySelector("#edCopy").onclick = async () => {
            try {
              await navigator.clipboard.writeText(json());
              note("Copied. Paste it into style.json next to index.html.");
            } catch (e) {
              note("Copy was blocked here — use Download instead.");
            }
          };
          if (!framed)
            ed.querySelector("#edDl").onclick = () => {
              try {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([json()], { type: "application/json" }));
                a.download = "style.json";
                document.body.appendChild(a);
                a.click();
                a.remove();
                note(
                  "Downloaded style.json. Put it next to index.html to make this the site style.",
                );
              } catch (e) {
                note("Download was blocked here — use Copy JSON instead.");
              }
            };
          ed.querySelector("#edImp").onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            f.text()
              .then((t) => {
                ST = merge(clone(STYLE_DEFAULTS), JSON.parse(t));
                saveStyle();
                applyStyle();
                renderEditor();
                note("Imported " + f.name + ".");
              })
              .catch(() => note("That file is not a valid style JSON."));
          };
        }
        function toggleEditor() {
          edOpen = !edOpen;
          const ed = document.getElementById("styleEd");
          ed.classList.toggle("open", edOpen);
          ed.setAttribute("aria-hidden", String(!edOpen));
          if (edOpen) renderEditor();
          document.getElementById("styleBtn").setAttribute("aria-pressed", String(edOpen));
        }

        document.getElementById("styleBtn").onclick = toggleEditor;
        addEventListener("keydown", (e) => {
          if (
            (e.key === "s" || e.key === "S") &&
            !e.ctrlKey &&
            !e.metaKey &&
            !e.altKey &&
            !/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || "")
          ) {
            e.preventDefault();
            if (!edOpen && !ST.overlays.styleButton) {
              ST.overlays.styleButton = true;
              saveStyle();
              recolor();
            }
            toggleEditor();
          }
        });
        /* ---------- deep links: #town-x, #precinct-n, #site-n, #block-n ---------- */
        let applying = false;
        function setHash() {
          if (applying) return;
          let h = "";
          if (S.state === 1) h = "town-" + slug(S.town.name);
          if (S.state === 2) {
            const pr = precs[S.prec];
            h = pr.site ? "site-" + (sites.indexOf(pr) + 1) : "precinct-" + S.prec;
          }
          if (S.state === 3) h = "block-" + S.blk.i;
          try {
            history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
          } catch (e) {}
        }
        function applyHash() {
          const h = location.hash.slice(1);
          applying = true;
          let m;
          if ((m = h.match(/^town-(.+)$/))) {
            const t = towns.find((t) => slug(t.name) === m[1]);
            t ? openTown(t) : go(0);
          } else if ((m = h.match(/^site-(\d+)$/)) && sites[+m[1] - 1]) openPrec(sites[+m[1] - 1]);
          else if ((m = h.match(/^precinct-(\d+)$/)) && precs[+m[1]]) openPrec(precs[+m[1]]);
          else if ((m = h.match(/^block-(\d+)$/)) && blocks[+m[1]]) openBlk(blocks[+m[1]]);
          else go(0);
          applying = false;
        }

        fetch("style.json", { cache: "no-store" })
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null)
          .then((js) => {
            SITE_STYLE = merge(clone(STYLE_DEFAULTS), js);
            ST = merge(clone(SITE_STYLE), loadSaved());
            recolor();
          })
          .then(() => fetch("map.json"))
          .then((r) => r.json())
          .then((d) => {
            D = d;
            VB = d.versBase;
            init();
          })
          .catch((e) => {
            console.error(e);
            P.innerHTML = "<p>The map data did not load. Reload the page to try again.</p>";
          });
      })();
    </script>
  </body>
</html>
